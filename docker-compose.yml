version: '3.8'                                                                                       
                                                                                                         
services:                                                                                            
    db:                                                                                                
        image: postgres:15                                                                               
        restart: unless-stopped                                                                          
        environment:                                                                                     
          POSTGRES_USER: postgres                                                                        
          POSTGRES_PASSWORD: password                                                                    
          POSTGRES_DB: flyrank                                                                           
        volumes:                                                                                         
          - postgres-data:/var/lib/postgresql/data                                                       
        ports:                                                                                           
          - "5432:5432"                                                                                  
                                                                                                         
    backend:                                                                                           
        build:                                                                                           
          context: .                                                                                     
          dockerfile: Dockerfile                                                                         
        restart: unless-stopped                                                                          
        ports:                                                                                           
          - "3000:3000"                                                                                  
        environment:                                                                                     
          - DATABASE_URL=postgres://postgres:password@db:5432/flyrank                                    
        depends_on:                                                                                      
          - db                                                                                           
                                                                                                         
    frontend:                                                                                          
        build:                                                                                           
          context: ./frontend                                                                            
          dockerfile: Dockerfile                                                                         
        restart: unless-stopped                                                                          
        ports:                                                                                           
          - "8080:80"                                                                                     
        depends_on:                                                                                      
          - backend                                                                                      
                                                                                                         
volumes:                                                                                             
      postgres-data: